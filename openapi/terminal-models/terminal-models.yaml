openapi: 3.0.0
servers:
  - url: http://localhost:8080
info:
  title: Terminal Models API
  version: 1.0.0
  description: API para gerenciamento de modelos de terminais e suas configurações.
  contact:
    name: Suporte
    email: suporte@example.com
tags:
  - name: terminal-models
    description: Operações relacionadas a modelos de terminais
  - name: terminal-model-configurations
    description: Operações relacionadas a configurações de modelos de terminais
paths:
  /terminal-models:
    post:
      summary: Criar modelo de terminal
      description: Cria um novo modelo de terminal.
      operationId: createTerminalModel
      tags: ["terminal-models"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/TerminalModel'
      responses:
        '201':
          description: Criado
    get:
      summary: Listar modelos de terminais
      description: Retorna a lista de modelos de terminais.
      operationId: listTerminalModels
      tags: ["terminal-models"]
      responses:
        '206':
          description: OK
  /terminal-models/{terminalModelId}:
    get:
      summary: Detalhar modelo de terminal
      description: Retorna detalhes do modelo de terminal informado.
      operationId: getTerminalModelById
      tags: ["terminal-models"]
      parameters:
        - in: path
          name: terminalModelId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    patch:
      summary: Atualizar modelo de terminal
      description: Atualiza o modelo de terminal informado.
      operationId: updateTerminalModel
      tags: ["terminal-models"]
      parameters:
        - in: path
          name: terminalModelId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/TerminalModel'
      responses:
        '200':
          description: Atualizado
    delete:
      summary: Remover modelo de terminal
      description: Remove o modelo de terminal informado.
      operationId: deleteTerminalModel
      tags: ["terminal-models"]
      parameters:
        - in: path
          name: terminalModelId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removido
  /terminal-models/{terminalModelId}/terminal-model-configurations:
    post:
      summary: Criar configuração de modelo de terminal
      description: Cria uma nova configuração para o modelo de terminal informado.
      operationId: createTerminalModelConfiguration
      tags: ["terminal-model-configurations"]
      parameters:
        - in: path
          name: terminalModelId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/TerminalModelConfiguration'
      responses:
        '201':
          description: Criado
    get:
      summary: Listar configurações de modelo de terminal
      description: Retorna a lista de configurações para o modelo de terminal informado.
      operationId: listTerminalModelConfigurations
      tags: ["terminal-model-configurations"]
      parameters:
        - in: path
          name: terminalModelId
          required: true
          schema:
            type: string
      responses:
        '206':
          description: OK
  /terminal-models/{terminalModelId}/terminal-model-configurations/{terminalModelConfigurationId}:
    get:
      summary: Detalhar configuração de modelo de terminal
      description: Retorna detalhes da configuração informada.
      operationId: getTerminalModelConfigurationById
      tags: ["terminal-model-configurations"]
      parameters:
        - in: path
          name: terminalModelId
          required: true
          schema:
            type: string
        - in: path
          name: terminalModelConfigurationId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    patch:
      summary: Atualizar configuração de modelo de terminal
      description: Atualiza a configuração informada.
      operationId: updateTerminalModelConfiguration
      tags: ["terminal-model-configurations"]
      parameters:
        - in: path
          name: terminalModelId
          required: true
          schema:
            type: string
        - in: path
          name: terminalModelConfigurationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/TerminalModelConfiguration'
      responses:
        '200':
          description: Atualizado
    delete:
      summary: Remover configuração de modelo de terminal
      description: Remove a configuração informada.
      operationId: deleteTerminalModelConfiguration
      tags: ["terminal-model-configurations"]
      parameters:
        - in: path
          name: terminalModelId
          required: true
          schema:
            type: string
        - in: path
          name: terminalModelConfigurationId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removido
