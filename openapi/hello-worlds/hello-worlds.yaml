openapi: 3.0.0
servers:
  - url: http://localhost:9090
info:
  title: Hello Worlds BFF API
  version: 1.0.0
  description: API BFF para o recurso hello-worlds, delegando ao demoapp via HTTP.
  contact:
    name: Suporte
    email: suporte@example.com
tags:
  - name: hello-worlds
    description: Operações do recurso hello-world via BFF
paths:
  /hello-worlds:
    post:
      summary: Criar hello-world
      description: Cria um novo recurso hello-world no demoapp upstream.
      operationId: createHelloWorld
      tags: ["hello-worlds"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelloWorldRequest'
      responses:
        '201':
          description: Criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloWorldResponse'
        '400':
          description: Requisição inválida
        '502':
          description: Erro de comunicação com o upstream
  /hello-worlds/{id}:
    get:
      summary: Detalhar hello-world
      description: Retorna o recurso hello-world com o ID informado.
      operationId: getHelloWorldById
      tags: ["hello-worlds"]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID numérico do recurso (inteiro positivo)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloWorldResponse'
        '400':
          description: ID inválido
        '404':
          description: Recurso não encontrado
        '502':
          description: Erro de comunicação com o upstream
    delete:
      summary: Remover hello-world
      description: Remove o recurso hello-world com o ID informado.
      operationId: deleteHelloWorld
      tags: ["hello-worlds"]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID numérico do recurso (inteiro positivo)
      responses:
        '204':
          description: Removido com sucesso
        '400':
          description: ID inválido
        '404':
          description: Recurso não encontrado
        '502':
          description: Erro de comunicação com o upstream

components:
  schemas:
    HelloWorldRequest:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    HelloWorldResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
