openapi: 3.0.0
info:
  title: Application Configurations API
  version: 1.0.0
  description: API para gerenciamento de configurações de aplicações.
paths:
  /application-configurations:
    get:
      summary: Listar configurações
      description: Retorna a lista de configurações de aplicações.
      operationId: listApplicationConfigurations
      tags: ["application-configurations"]
      responses:
        '200':
          description: OK
    post:
      summary: Criar configuração
      description: Cria uma nova configuração de aplicação.
      operationId: createApplicationConfiguration
      tags: ["application-configurations"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ApplicationConfiguration'
      responses:
        '201':
          description: Criado
  /application-configurations/{configurationId}:
    get:
      summary: Detalhar configuração
      description: Retorna detalhes da configuração informada.
      operationId: getApplicationConfigurationById
      tags: ["application-configurations"]
      parameters:
        - in: path
          name: configurationId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:
      summary: Atualizar configuração
      description: Atualiza a configuração informada.
      operationId: updateApplicationConfigurationById
      tags: ["application-configurations"]
      parameters:
        - in: path
          name: configurationId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ApplicationConfiguration'
      responses:
        '200':
          description: Atualizado
    delete:
      summary: Remover configuração
      description: Remove a configuração informada.
      operationId: deleteApplicationConfigurationById
      tags: ["application-configurations"]
      parameters:
        - in: path
          name: configurationId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removido
