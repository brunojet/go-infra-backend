openapi: 3.0.0
servers:
  - url: http://localhost:8080
info:
  title: Filters API
  version: 1.0.0
  description: API para gerenciamento de filtros.
  contact:
    name: Suporte
    email: suporte@example.com
tags:
  - name: filters
    description: Operações relacionadas a filtros
paths:
  /filter-types/{filterTypeId}/filters:
    get:
      summary: Listar filtros do tipo
      description: Retorna a lista de filtros para o tipo informado.
      operationId: listFiltersByType
      tags: ["filters"]
      parameters:
        - in: path
          name: filterTypeId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    post:
      summary: Criar filtro para o tipo
      description: Cria um novo filtro para o tipo informado.
      operationId: createFilterForType
      tags: ["filters"]
      parameters:
        - in: path
          name: filterTypeId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Filter'
      responses:
        '201':
          description: Criado
  /filter-types/{filterTypeId}/filters/{filterId}:
    get:
      summary: Detalhar filtro
      description: Retorna detalhes do filtro informado.
      operationId: getFilterById
      tags: ["filters"]
      parameters:
        - in: path
          name: filterTypeId
          required: true
          schema:
            type: integer
        - in: path
          name: filterId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
    put:
      summary: Atualizar filtro
      description: Atualiza o filtro informado.
      operationId: updateFilterById
      tags: ["filters"]
      parameters:
        - in: path
          name: filterTypeId
          required: true
          schema:
            type: integer
        - in: path
          name: filterId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: Atualizado
    delete:
      summary: Remover filtro
      description: Remove o filtro informado.
      operationId: deleteFilterById
      tags: ["filters"]
      parameters:
        - in: path
          name: filterTypeId
          required: true
          schema:
            type: integer
        - in: path
          name: filterId
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Removido
