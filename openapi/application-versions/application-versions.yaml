openapi: 3.0.0
servers:
  - url: http://localhost:8080
info:
  title: Application Versions API
  version: 1.0.0
  description: API para gerenciamento de versões de aplicação.
  contact:
    name: Suporte
    email: suporte@example.com
tags:
  - name: application-versions
    description: Operações relacionadas a versões de aplicação
paths:
  /applications/{applicationId}/application-versions:
    post:
      summary: Criar versão de aplicação
      description: Cria uma nova versão para a aplicação informada.
      operationId: createApplicationVersion
      tags: ["application-versions"]
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ApplicationVersion'
      responses:
        '201':
          description: Criado
    get:
      summary: Listar versões de aplicação
      description: Retorna a lista de versões para a aplicação informada.
      operationId: listApplicationVersions
      tags: ["application-versions"]
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: string
      responses:
        '206':
          description: OK
  /applications/{applicationId}/application-versions/{applicationVersionId}:
    get:
      summary: Detalhar versão de aplicação
      description: Retorna detalhes da versão informada.
      operationId: getApplicationVersionById
      tags: ["application-versions"]
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: string
        - in: path
          name: applicationVersionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    patch:
      summary: Atualizar versão de aplicação
      description: Atualiza a versão informada.
      operationId: updateApplicationVersion
      tags: ["application-versions"]
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: string
        - in: path
          name: applicationVersionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/components/schemas/ApplicationVersion'
      responses:
        '200':
          description: Atualizado
    delete:
      summary: Remover versão de aplicação
      description: Remove a versão informada.
      operationId: deleteApplicationVersion
      tags: ["application-versions"]
      parameters:
        - in: path
          name: applicationId
          required: true
          schema:
            type: string
        - in: path
          name: applicationVersionId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removido
